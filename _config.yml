# 사이트 기본 정보
title: "㈜에스이에이치인터내셔널"
description: "근로자 파견, 도급(업무위탁), 유통·물류 아웃소싱, 채용대행·헤드헌팅, 급여대행 전문 기업"
lang: ko

# 사이트 주소 (사이트맵·대표 이미지·검색엔진용 절대주소에 사용)
# 회사 도메인(예: www.sehi.co.kr)을 연결하면 url을 그 주소로, baseurl은 ""로 바꾸면 됨
url: "https://ivovilove2-maker.github.io"
baseurl: "/github.io"

# 검색엔진 설정
seo:
  noindex: true                          # true = 검색엔진 수집 차단(임시). 검색에 노출하려면 false로 변경
  home_title: "SEHI 에스이에이치인터내셔널 | 근로자 파견·도급·채용대행·헤드헌팅·급여대행"
  keywords: "에스이에이치인터내셔널, SEHI, 근로자파견, 인력파견, 파견업체, 도급, 업무위탁, 인력아웃소싱, 채용대행, 헤드헌팅, 서치펌, 급여대행, 페이롤, 매장도급, 물류도급, 콜센터 채용, 가산디지털단지"
  image: "/images/og-image.png"          # 링크 미리보기 대표 이미지 (1200×630)
  naver_verification: ""                 # 네이버 서치어드바이저 소유확인 meta 코드 (content 값만)
  google_verification: ""                # 구글 서치콘솔 소유확인 meta 코드 (content 값만)

plugins:
  - jekyll-sitemap                        # /sitemap.xml 자동 생성

# 회사 정보 (푸터·문의처에서 공통으로 사용)
company:
  name: "㈜에스이에이치인터내셔널"
  ceo: "전인성"
  biz_no: "237-88-00589"
  address: "서울특별시 금천구 가산디지털1로 84, 에이스하이엔드타워 8차 4층 406호"
  tel: "02-866-0401"
  fax: "02-866-0402"
  email: "sehi0401@daum.net"
  inquiry_email: "ekra2@naver.com"   # 고객문의 양식이 도착하는 메일 (FormSubmit)
  # EmailJS (회사 전용 디자인 메일). 세 값을 모두 넣으면 EmailJS로, 비어 있으면 FormSubmit으로 보냄
  emailjs_public_key: ""
  emailjs_service_id: ""
  emailjs_template_id: ""
  blog: "https://blog.naver.com/sehi0403"
  contacts:
    - { name: "서울본사", phones: ["02-866-0401", "070-4236-1916"] }
    - { name: "중부지점", phones: ["010-2210-8219", "070-4229-4747"] }

# 공지사항 게시판: _notices 폴더의 글 파일 하나 = 공지 하나
collections:
  notices:
    output: true
    permalink: /notice/:name.html
  jobs:                                # 채용공고 (이미지 게시판): _jobs 폴더의 글 하나 = 공고 하나
    output: true
    permalink: /recruit/:name.html

defaults:
  - scope:
      path: ""
      type: notices
    values:
      layout: notice
      group: "Notice"
      heading: "공지사항"     # 상단 큰 제목
      lnb: "notice.html"     # 서브메뉴에서 '공지사항'을 선택된 상태로 표시
      writer: "SEHI"
  - scope:
      path: ""
      type: jobs
    values:
      layout: job
      group: "Recruit"
      heading: "채용공고"
      lnb: "recruit.html"
      writer: "SEHI"

# 이 폴더/파일은 사이트에 올라가지 않음
exclude:
  - README.md
