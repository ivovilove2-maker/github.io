---
layout: sub
title: "고객문의"
group: "채용문의"
description: "㈜에스이에이치인터내셔널 고객문의"
---
    <div class="rq-head">
      <p class="ab-ey">INQUIRY</p>
      <h2>메일로 문의하기</h2>
      <p>아래 양식을 작성하고 <b>문의 보내기</b>를 누르면 담당자 메일로 바로 전달됩니다. 전화 상담도 가능합니다.</p>
    </div>

    <p class="inq-done" id="inqDone" hidden>문의가 접수되었습니다. 담당자가 확인 후 연락드리겠습니다.</p>
    <form class="inq-form" id="inqForm" action="https://formsubmit.co/{{ site.company.inquiry_email }}" method="POST">
      <input type="hidden" name="_subject" value="[홈페이지 고객문의]">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="">
      <input type="text" name="_honey" class="inq-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="row2">
        <label>회사명 <input type="text" name="회사명" required></label>
        <label>담당자명 <input type="text" name="담당자명" required></label>
      </div>
      <div class="row2">
        <label>연락처 <input type="tel" name="연락처" required placeholder="010-0000-0000"></label>
        <label>이메일 <input type="email" name="email"></label>
      </div>
      <label>문의 구분
        <select name="문의구분">
          <option>파견/도급</option><option>채용대행</option><option>헤드헌팅</option><option>급여대행</option><option>기타</option>
        </select>
      </label>
      <label>문의 내용 <textarea name="문의내용" rows="7" required placeholder="회사위치, 채용직종, 인원, 근무시간, 급여수준 등을 적어주세요."></textarea></label>
      <button type="submit" class="btn btn-primary">문의 보내기 →</button>
    </form>

    {% include contact-cta.html %}
