---
layout: sub
title: "고객문의"
group: "채용문의"
description: "㈜에스이에이치인터내셔널 고객문의"
---
    <div class="rq-head">
      <p class="ab-ey">INQUIRY</p>
      <h2>메일로 문의하기</h2>
      <p>아래 양식을 작성하고 <b>메일로 보내기</b>를 누르면 메일 프로그램이 열립니다. 전화 상담도 가능합니다.</p>
    </div>

    <form class="inq-form" id="inqForm">
      <div class="row2">
        <label>회사명 <input type="text" name="company" required></label>
        <label>담당자명 <input type="text" name="name" required></label>
      </div>
      <div class="row2">
        <label>연락처 <input type="tel" name="tel" required placeholder="010-0000-0000"></label>
        <label>이메일 <input type="email" name="email"></label>
      </div>
      <label>문의 구분
        <select name="type">
          <option>파견/도급</option><option>채용대행</option><option>헤드헌팅</option><option>급여대행</option><option>기타</option>
        </select>
      </label>
      <label>문의 내용 <textarea name="message" rows="7" required placeholder="회사위치, 채용직종, 인원, 근무시간, 급여수준 등을 적어주세요."></textarea></label>
      <button type="submit" class="btn btn-primary">메일로 보내기 →</button>
    </form>
