<div class="cta">
  <div>
    <h3>상담 문의</h3>
    <p>{% for ct in site.company.contacts %}{{ ct.name }} {{ ct.phones | join: " · " }}{% unless forloop.last %} &nbsp;/&nbsp; {% endunless %}{% endfor %}</p>
  </div>
  <div class="btns">
    <a class="btn btn-primary" href="tel:{{ site.company.tel | remove: '-' }}">전화 상담</a>
    <a class="btn btn-line" href="{{ '/inquiry.html' | relative_url }}">고객문의</a>
  </div>
</div>
