<div class="cta">
  <p class="cta-lb">상담 문의</p>
  <ul class="cta-tel">
    {% for ct in site.company.contacts %}<li><span>{{ ct.name }}</span>{% for p in ct.phones %}<a href="tel:{{ p | remove: '-' }}">{{ p }}</a>{% unless forloop.last %}<i>·</i>{% endunless %}{% endfor %}</li>{% endfor %}
  </ul>
  {% unless page.url contains 'inquiry' %}<a class="cta-go" href="{{ '/inquiry.html' | relative_url }}">문의 양식 작성 →</a>{% endunless %}
</div>
